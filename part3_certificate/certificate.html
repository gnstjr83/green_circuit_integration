<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>성능 보증서</title>
<link rel="stylesheet" href="/assets/ui.css">
<style>
  .page{padding-bottom:48px}
  /* 보증서 표지 */
  .doc{position:relative;background:var(--surface);border-radius:var(--radius);padding:24px 20px 20px;margin:12px 0;overflow:hidden}
  .doc::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--primary)}
  .doc-kind{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
  .doc-model{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.3;margin:14px 0 4px;padding-right:96px}
  .doc-spec{font-size:15px;color:var(--ink-2);padding-right:96px}
  .seal{position:absolute;right:18px;top:30px;width:80px;height:80px;border-radius:50%;border:2px solid var(--primary);color:var(--primary);display:grid;place-items:center;text-align:center;transform:rotate(-8deg)}
  .seal::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1px solid currentColor;opacity:.5}
  .seal b{display:block;font-size:14px;letter-spacing:-.02em}
  .seal small{display:block;font-size:9px;font-weight:600;letter-spacing:.06em;font-family:var(--mono)}
  .seal.bad{border-color:var(--danger);color:var(--danger)}
  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:22px;padding-top:18px;border-top:1px dashed var(--line-strong)}
  .meta-grid dt{font-size:12px;color:var(--ink-3);margin:0}
  .meta-grid dd{font-size:14px;font-weight:600;margin:2px 0 0}
  .doc .tags{margin-top:18px}
  /* 요약 */
  .summary-text{font-size:15px;line-height:1.7;margin:0}
  .points{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .points h3{font-size:13px;font-weight:600;color:var(--ink-3);margin:0 0 6px}
  .points ul{margin:0;padding:0;list-style:none}
  .points li{font-size:14px;padding-left:12px;position:relative;margin:3px 0}
  .points li::before{content:"";position:absolute;left:0;top:.7em;width:4px;height:4px;border-radius:50%;background:var(--ink-3)}
  .points .good li::before{background:var(--primary)}
  .points .check li::before{background:var(--warn)}
  @media (max-width:420px){.points{grid-template-columns:1fr;gap:14px}}
  .by{font-size:12px;color:var(--ink-3);margin-top:12px}
  /* 시세 */
  .price{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:2px 0 4px}
  .price-sub{font-size:13px;color:var(--ink-3)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  th{font-weight:600;color:var(--ink-3);text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
  td{padding:10px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  td small{color:var(--ink-3);display:block;margin-top:2px}
  td.r,th.r{text-align:right;white-space:nowrap}
  /* 점검표 */
  .check-table td:first-child{font-weight:600;width:72px}
  .check-table td:nth-child(2){color:var(--ink-2)}
  /* 사진 */
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .gallery figure{margin:0}
  .gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--surface-2);display:block}
  .gallery figcaption{font-size:12px;color:var(--ink-3);margin-top:4px}
  /* 탄소 영수증 */
  .receipt{background:var(--paper);color:var(--paper-ink);padding:22px 20px 26px;font:13px/1.65 var(--mono);position:relative;margin:4px 6px 14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .receipt::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(-45deg,transparent 6px,var(--paper) 0) 0 0/12px 8px repeat-x,linear-gradient(45deg,transparent 6px,var(--paper) 0) 0 0/12px 8px repeat-x}
  .receipt h3{text-align:center;margin:0;font-size:15px;letter-spacing:.24em}
  .receipt .c{text-align:center;opacity:.7;font-size:12px}
  .receipt hr{border:0;border-top:1px dashed currentColor;opacity:.35;margin:12px 0}
  .receipt .l{display:flex;justify-content:space-between;gap:12px}
  .receipt .l span:last-child{text-align:right}
  .receipt .sub{opacity:.7;font-size:12px}
  .receipt .total{font-size:16px;font-weight:700}
  .receipt .fine{font-size:11px;opacity:.65;margin-top:8px;word-break:keep-all}
  /* 환경 온도 */
  .temp{display:flex;align-items:baseline;justify-content:space-between}
  .temp b{font-size:24px;letter-spacing:-.02em}
  .thermo{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:10px 0 8px}
  .thermo i{display:block;height:100%;background:var(--primary);border-radius:4px}
  /* 기타 */
  .fineprint{margin:0;padding-left:16px;font-size:13px;color:var(--ink-2)}
  .fineprint li{margin:4px 0}
  .share{display:flex;gap:16px;align-items:center}
  #qr{background:#fff;padding:8px;border-radius:10px;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
  #qr img,#qr canvas{display:block}
  .hash{font:11px/1.5 var(--mono);color:var(--ink-3);word-break:break-all;margin-top:8px}
  .demo{display:none}
  .err{color:var(--danger);font-size:14px}
  @media print{.appbar,.share-section,.demo{display:none!important}body{background:#fff}.section,.doc{break-inside:avoid}}
</style>
</head>
<body>
<header class="appbar"><div class="appbar-in">
  <span class="brand"><span class="brand-mark"></span>성능 보증서</span>
  <span class="appbar-meta" id="bar-no"></span>
</div></header>
<main class="page" id="app"><p class="muted" style="padding:40px 0">보증서 불러오는 중</p></main>
<div class="cta" id="cert-cta" hidden><div class="cta-in btn-row"><button class="btn btn-secondary" id="cta-copy">링크 복사</button><a class="btn btn-primary" id="cta-ask" href="#market-controls">구매 문의하기</a></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/assets/price-reference.js"></script>
<script src="/assets/hardware-details.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const id = location.pathname.split('/').filter(Boolean)[1];
const T = new URLSearchParams(location.search).get('t') || '';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = (n) => n.toLocaleString('ko-KR') + '원';
const man = (n) => (n >= 10000 ? `${+(n / 10000).toFixed(1)}만원` : won(n));
const deg = (n) => Number(n).toFixed(1) + '°C';
const date = (s) => { const d = new Date(s); return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`; };
const STATUS = { pass: '점검 통과', fail: '점검 실패', unsupported: '미지원', pending: '미완료' };
const STATUS_CLASS = { pass: 'pass', fail: 'fail', unsupported: 'warn', pending: 'warn' };
const LABEL = { camera: '카메라', microphone: '마이크', speaker: '스피커', touch: '터치', gyro: '센서' };
const CERT_STATUS = { listed: ['판매 중', 'good'], sold: ['판매 완료', ''], donated: ['기부 완료', ''], recycled: ['배출 완료', ''], expired: ['유효기간 만료', 'warn'] };
const TRUST = { high: ['신뢰도 높음', 'good'], medium: ['신뢰도 보통', 'warn'], low: ['신뢰도 낮음', 'bad'] };
const OUTCOME = { sold: '판매(재사용)', donated: '기부(재사용)', recycled: '분리배출' };
const PHOTO = { test_camera: '점검 촬영', front: '앞면', back: '뒷면', side: '옆면', other: '기타' };

function measure(k, it) { return hardwareDetails(k, it); }

function render({ certificate: c, verified, expired, seller }) {
  document.title = `${c.device.model} 성능 보증서`;
  $('#bar-no').textContent = `No. ${c.id}`;
  const st = CERT_STATUS[expired ? 'expired' : c.status] || [c.status, ''];
  const tr = TRUST[c.trust.level];
  const p = c.price, cb = c.carbon, sm = c.summary || {};
  const temp = seller ? seller.temperature : c.seller.temperatureAtIssue;
  const done = c.outcome;
  const pv = c.ecoPreview && c.ecoPreview.sold;

  // 시세 막대: 같은 기종 범위 안에서 최저~최고를 0~100% 로
  const priceHtml = renderPriceReference(p);

  const carbonSource = cb.basis === 'official'
    ? `${esc(cb.source.name)}${cb.source.report ? ' · ' + esc(cb.source.report) : ''}${cb.region ? ' · ' + esc(cb.region) + ' 기준' : ''}`
    : `공식 값 없음 · ${esc(cb.source.name)}`;

  $('#app').innerHTML = `
  <article class="doc">
    <div class="doc-kind">Performance Certificate</div>
    <h1 class="doc-model">${esc(c.device.brand)} ${esc(c.device.model)}</h1>
    <div class="doc-spec">${esc(c.device.storage)} · ${esc(c.condition.label_ko || c.condition.code)}</div>
    <div class="seal ${verified ? '' : 'bad'}"><div><b>${verified ? '원본 확인' : '변조 의심'}</b><small>${esc(c.integrity.sha256.slice(0, 8).toUpperCase())}</small></div></div>
    <dl class="meta-grid">
      <div><dt>보증서 번호</dt><dd class="num">${esc(c.id)}</dd></div>
      <div><dt>발급일</dt><dd>${date(c.issuedAt)}</dd></div>
      <div><dt>유효기간</dt><dd>${date(c.expiresAt)}까지</dd></div>
      <div><dt>점검일</dt><dd>${date(c.test.testedAt)}</dd></div>
      <div><dt>판매자</dt><dd>${esc(c.seller.nickname)}${seller ? ` · ${deg(seller.temperature)}` : ''}</dd></div>
    </dl>
    <div class="tags">
      <span class="tag ${st[1]}">${st[0]}</span>
      <span class="tag ${tr[1]}">${tr[0]}</span>
      <span class="tag">점검 ${c.test.passedCount}/${c.test.totalCount} 정상</span>
      ${c.demo ? '<span class="tag">데모</span>' : ''}
    </div>
  </article>

  <section class="section">
    <h2 class="section-label">요약</h2>
    <p class="summary-text">${esc(sm.summary_ko)}</p>
    <div class="points">
      ${sm.strengths_ko && sm.strengths_ko.length ? `<div class="good"><h3>장점</h3><ul>${sm.strengths_ko.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      ${sm.cautions_ko && sm.cautions_ko.length ? `<div class="check"><h3>확인 필요</h3><ul>${sm.cautions_ko.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    </div>
    <div class="by">${sm.by === 'gemini' ? `Gemini 작성 · ${esc(sm.model || '')}` : '점검 결과 기반 자동 작성'}</div>
  </section>

  <section class="section">
    <h2 class="section-label">판매 희망가</h2>
    <div class="price">${c.askingPriceKrw ? won(c.askingPriceKrw) : '가격 미정 (이전 매물)'}</div>
    <p class="price-sub">판매자가 정한 플랫폼 등록 가격입니다.</p>
    <h2 class="section-label" style="margin-top:20px">업체 매입 참고가</h2>
    ${priceHtml}
  </section>

  <section class="section">
    <h2 class="section-label">하드웨어 점검</h2>
    <table class="check-table">
      ${Object.keys(LABEL).map((k) => { const it = c.test.items[k]; return `<tr><td>${LABEL[k]}</td><td>${esc(measure(k, it))}</td><td class="r"><span class="status ${STATUS_CLASS[it.status] || ''}">${STATUS[it.status] || it.status}</span></td></tr>`; }).join('')}
      ${c.assessment && c.assessment.battery && c.assessment.battery.healthPct !== null
        ? `<tr><td>배터리</td><td>최대 용량 ${c.assessment.battery.healthPct}%${c.assessment.battery.cycleCount !== null ? ` · 사이클 ${c.assessment.battery.cycleCount}회` : ''}<small>판매자 설정 화면 캡처를 AI가 판독한 값</small></td><td class="r"><span class="status ${c.assessment.battery.low ? 'warn' : 'pass'}">${c.assessment.battery.low ? '저하' : '캡처 확인'}</span></td></tr>`
        : `<tr><td>배터리</td><td>웹 점검 불가</td><td class="r"><span class="status warn">미점검</span></td></tr>`}
    </table>
    ${c.test.items.camera.photoGrade ? `<p class="muted" style="margin:10px 0 0">카메라 등급은 촬영 사진 1장 기준 화질 등급. 외관·시세 등급과 무관.</p>` : ''}
  </section>

  <section class="section">
    <h2 class="section-label">기기 상태 <span style="font-weight:500">· ${c.condition.verified && c.condition.verified.exterior ? '판매자 입력 · AI 판별 일치' : '판매자 입력'}</span></h2>
    <dl class="rows">
      <div><dt>외관·화면</dt><dd>${esc(c.condition.label_ko || c.condition.code)}</dd></div>
      ${c.assessment && c.assessment.ai && c.assessment.ai.condition.code ? `<div><dt>AI 외관 판별</dt><dd>${esc(c.assessment.ai.condition.label_ko)}${c.assessment.sellerAgreesWithAi === false ? ' · 판매자 선택과 다름' : ''}${c.assessment.ai.condition.damages.length ? `<br><small>${c.assessment.ai.condition.damages.map(esc).join(', ')}</small>` : ''}</dd></div>` : ''}
      <div><dt>알려진 기능 고장</dt><dd>${esc(c.condition.knownFaultLabel_ko)}${c.condition.faultDetail_ko ? `<br><small>${esc(c.condition.faultDetail_ko)}</small>` : ''}</dd></div>
      <div><dt>저장 용량</dt><dd>${esc(c.device.storage)}</dd></div>
      ${c.askingPriceKrw ? `<div><dt>판매 희망가</dt><dd>${c.askingPriceKrw.toLocaleString('ko-KR')}원</dd></div>` : ''}
      <div><dt>기종 일치</dt><dd>${c.device.matchesUserAgent === false ? '접속 기기와 불일치' : c.device.matchesUserAgent ? '접속 기기와 일치' : '확인 불가'}</dd></div>
    </dl>
  </section>

  ${c.photos.filter((x) => !x.skipped).length ? `<section class="section"><h2 class="section-label">사진</h2><div class="gallery">
    ${c.photos.filter((x) => !x.skipped).map((x) => `<figure><a href="${esc(x.url)}" target="_blank"><img src="${esc(x.url)}" alt="${esc(PHOTO[x.kind] || x.label_ko)}" loading="lazy"></a><figcaption>${esc(PHOTO[x.kind] || x.label_ko)}</figcaption></figure>`).join('')}
  </div></section>` : ''}

  <section class="section">
    <h2 class="section-label">탄소 영수증</h2>
    <div class="receipt">
      <h3>CARBON RECEIPT</h3>
      <div class="c">No. ${esc(c.id)} · ${date(c.issuedAt)}</div>
      <hr>
      <div class="l"><span>품목</span><span>${esc(c.device.model)} ${esc(c.device.storage)}</span></div>
      <div class="l"><span>처리</span><span>${done ? OUTCOME[done.type] : '재사용 예정'}</span></div>
      <hr>
      <div class="l"><span>신규 생산 회피</span><span>${cb.avoidedKg} kg</span></div>
      ${cb.basis === 'official' && cb.lifecycleKg ? `<div class="l sub"><span>전 과정 ${cb.lifecycleKg}kg × 생산 ${Math.round(cb.productionShare * 100)}%</span><span></span></div>` : ''}
      <div class="l sub"><span>상수리나무 환산</span><span>${cb.equivalence.oakTreesYear}그루·년</span></div>
      <hr>
      <div class="l total"><span>CO₂e 감축</span><span>${done ? done.creditedKg : cb.avoidedKg} kg</span></div>
      <hr>
      <div class="l"><span>판매자 환경 온도</span><span>${deg(temp)}</span></div>
      ${done ? `<div class="l sub"><span>${OUTCOME[done.type]} 반영</span><span>+${done.delta.toFixed(2)}</span></div>`
        : pv ? `<div class="l sub"><span>판매 완료 시</span><span>${deg(pv.after)} (+${pv.delta.toFixed(2)})</span></div>` : ''}
      <hr>
      <div class="fine">근거: ${carbonSource}${cb.storageNote_ko ? '<br>' + esc(cb.storageNote_ko) : ''}<br>재사용 1대가 신규 생산 1대를 대체한다고 가정한 최대 추정치. 나무 환산은 30년생 상수리나무 연 ${cb.equivalence.perTreeKg}kg 흡수 기준(국립산림과학원).</div>
    </div>
  </section>

  ${seller ? `<section class="section">
    <h2 class="section-label">판매자 환경 온도</h2>
    <div class="temp"><span style="font-weight:600">${esc(seller.nickname)}</span><b>${deg(seller.temperature)}</b></div>
    <div class="thermo"><i style="width:${Math.min(100, seller.temperature)}%"></i></div>
    <div class="muted">보증서 ${seller.certificates}건 · 재사용 ${seller.reused}건 · 분리배출 ${seller.recycled}건 · 누적 감축 ${seller.totalAvoidedKg}kg CO₂e</div>
  </section>` : ''}

  <section class="section">
    <h2 class="section-label">유의사항</h2>
    <ul class="fineprint">
      ${c.trust.reasons.map((x) => `<li>${esc(x)}</li>`).join('')}
      <li>${date(c.test.testedAt)} 웹 점검 기준. 기기 고유번호(IMEI)는 확인하지 않음</li>
      <li>시세는 업체 매입 참고가. 배터리·잔상·수리 이력·검수 결과에 따라 실제 금액 상이</li>
      <li>직거래 시 같은 기기로 재점검 권장</li>
    </ul>
    <div class="hash">SHA-256 ${esc(c.integrity.sha256)}</div>
  </section>

  <section class="section share-section">
    <h2 class="section-label">공유</h2>
    <div class="share">
      <div id="qr"></div>
      <div>
        <p class="small" style="margin:0 0 10px">QR이나 링크로 이 보증서를 그대로 볼 수 있음</p>
        <button class="btn btn-secondary" id="copy">링크 복사</button>
      </div>
    </div>
  </section>

  <section class="section" id="market-controls"></section>`;

  const share = location.origin + location.pathname;
  if (window.QRCode) new QRCode($('#qr'), { text: share, width: 96, height: 96 });
  $('#copy').onclick = () => navigator.clipboard.writeText(share).then(() => { $('#copy').textContent = '복사됨'; });
  window.renderMarketControls({ certificate: c, expired, token: T, reload: load });
  // 하단 고정 바: 공유와 문의를 어디서든 바로
  const cta = document.getElementById('cert-cta');
  const mc = document.getElementById('market-controls');
  const askBtn = document.getElementById('cta-ask');
  if (new URLSearchParams(location.search).has('manage')) askBtn.textContent = '문의 · 판매 관리';
  askBtn.hidden = !(mc && mc.innerHTML.trim());
  if (mc) mc.style.scrollMarginTop = '96px';
  document.getElementById('cta-copy').onclick = e => navigator.clipboard.writeText(share).then(() => {
    e.currentTarget.textContent = '복사됐어요 ✓';
    setTimeout(() => { document.getElementById('cta-copy').textContent = '링크 복사'; }, 2500);
  });
  cta.hidden = false;
}

async function load() {
  try {
    const r = await fetch('/api/public/certificates/' + encodeURIComponent(id));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
    render(j);
  } catch (e) {
    $('#app').innerHTML = `<p class="err" style="padding:40px 0">보증서를 불러오지 못함: ${esc(e.message)}</p>`;
  }
}
// 관리 스크립트 로드 뒤 시작.
</script>
<script src="/assets/market.js"></script>
<script>load();</script>
<script src="/assets/nav.js"></script>
</body>
</html>
